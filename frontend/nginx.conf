# Domínio raiz e www mostram a landing; app.<dominio> mostra o aplicativo.
map $host $inicio {
    default        /;
    ~^(www\.)?nutrisnapia\.com\.br$  /landing/;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.nutrisnapia.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / {
        if ($inicio != "/") { return 302 $inicio; }
        try_files /index.html =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files /sw.js =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
