# Produção (Contabo). O proxy (Nginx Proxy Manager) é dono das portas 80/443:
# nenhum container publica porta no host.
# Segredos ficam fora do repositório: /opt/fm/nutrisnap/.env e .env.db (modo 600).
services:
  backend:
    build: ./backend
    image: nutrisnap-backend:${RELEASE:-local}
    container_name: nutrisnap-backend
    restart: unless-stopped
    env_file: /opt/fm/nutrisnap/.env
    environment:
      PORT: "8080"
      GIN_MODE: release
    expose: ["8080"]
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      db: { condition: service_healthy }
    networks: [nutrisnap, proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.nutrisnapia.com.br/api/v1
    image: nutrisnap-frontend:${RELEASE:-local}
    container_name: nutrisnap-frontend
    restart: unless-stopped
    expose: ["80"]
    mem_limit: 64m
    cpus: 0.5
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  db:
    image: postgres:16-alpine
    container_name: nutrisnap-db
    restart: unless-stopped
    env_file: /opt/fm/nutrisnap/.env.db
    volumes:
      - nutrisnap-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [nutrisnap]

volumes:
  nutrisnap-pgdata:

networks:
  nutrisnap: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
